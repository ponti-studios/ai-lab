[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab"
version = "0.2.0"
description = "Ponti Studios internal AI lab for workers, pipelines, evals, prompts, and benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ai-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
